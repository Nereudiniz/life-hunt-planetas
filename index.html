<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Life Hunt — Arquivo Planetário</title>

<style>
:root {
  --bg: #02080e;
  --panel: rgba(7, 27, 40, .93);
  --panel2: rgba(10, 40, 57, .82);
  --line: rgba(76, 220, 255, .40);
  --cyan: #43e6ff;
  --cyan2: #a5f5ff;
  --text: #edfaff;
  --muted: #8eb7c4;
  --shadow: 0 0 28px rgba(30, 215, 255, .12);
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  min-height: 100vh;
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  background:
    radial-gradient(circle at 20% 0%, rgba(0,161,214,.13), transparent 34rem),
    radial-gradient(circle at 90% 25%, rgba(0,238,255,.08), transparent 28rem),
    #02080e;
}

button, input { font: inherit; }

button { -webkit-tap-highlight-color: transparent; }

.app {
  width: min(1120px, 100%);
  margin: 0 auto;
  min-height: 100vh;
}

.hero {
  position: relative;
  min-height: min(66vh, 660px);
  background-image:
    linear-gradient(to bottom, rgba(1,8,13,.03) 35%, rgba(1,8,13,.94) 100%),
    url("cover.jpg");
  background-size: cover;
  background-position: center;
  border-left: 1px solid rgba(70,226,255,.10);
  border-right: 1px solid rgba(70,226,255,.10);
  overflow: hidden;
}

.hero::after {
  content: "";
  position: absolute;
  inset: auto 0 0 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--cyan), transparent);
  opacity: .6;
  box-shadow: 0 0 24px var(--cyan);
}

.hero-title {
  position: absolute;
  left: 20px;
  right: 20px;
  bottom: 26px;
  text-align: center;
}

.hero-kicker {
  color: var(--cyan);
  letter-spacing: .36em;
  font-size: clamp(.72rem, 2.8vw, .95rem);
  font-weight: 700;
  text-transform: uppercase;
  text-shadow: 0 0 12px rgba(67,230,255,.6);
}

.hero-title h1 {
  margin: 8px 0 0;
  font-size: clamp(1.7rem, 6vw, 3rem);
  font-weight: 300;
  letter-spacing: .13em;
  text-transform: uppercase;
}

.home-content {
  padding: 8px 16px 56px;
}

.intro {
  max-width: 760px;
  margin: 18px auto 20px;
  text-align: center;
  color: var(--muted);
  line-height: 1.5;
}

.level-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0,1fr));
  gap: 12px;
  margin: 22px auto 0;
}

.level-card {
  position: relative;
  appearance: none;
  border: 1px solid var(--line);
  background:
    linear-gradient(145deg, rgba(13,58,76,.95), rgba(3,17,27,.97));
  color: var(--text);
  border-radius: 18px;
  min-height: 150px;
  padding: 18px 12px;
  cursor: pointer;
  overflow: hidden;
  box-shadow: var(--shadow);
  transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
}

.level-card::before {
  content: "";
  position: absolute;
  inset: 8px;
  border: 1px solid rgba(83,228,255,.13);
  border-radius: 13px;
  pointer-events: none;
}

.level-card:hover {
  transform: translateY(-3px);
  border-color: rgba(86,237,255,.8);
  box-shadow: 0 0 32px rgba(28,220,255,.18);
}

.level-roman {
  display: grid;
  place-items: center;
  width: 62px;
  height: 62px;
  margin: 0 auto 11px;
  border-radius: 50%;
  border: 2px solid rgba(87,235,255,.75);
  background: radial-gradient(circle, rgba(44,207,255,.18), rgba(2,11,18,.9) 67%);
  color: #fff;
  font-size: 1.75rem;
  font-weight: 300;
  box-shadow: inset 0 0 20px rgba(38,225,255,.18), 0 0 20px rgba(38,225,255,.14);
}

.level-label {
  display: block;
  color: var(--cyan2);
  letter-spacing: .10em;
  font-size: .82rem;
  text-transform: uppercase;
}

.level-count {
  display: block;
  margin-top: 5px;
  color: var(--muted);
  font-size: .78rem;
}

.screen {
  display: none;
  padding: 14px 16px 56px;
}

.screen.active { display: block; }

.topbar {
  display: flex;
  align-items: center;
  gap: 14px;
  min-height: 62px;
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(2,8,14,.88);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(65,223,255,.14);
}

.back {
  appearance: none;
  border: 1px solid rgba(67,230,255,.23);
  background: rgba(9,36,51,.85);
  color: var(--cyan2);
  border-radius: 999px;
  padding: 9px 13px;
  cursor: pointer;
}

.screen-title {
  margin: 0;
  font-size: clamp(1.2rem, 4vw, 1.8rem);
  font-weight: 400;
  letter-spacing: .06em;
}

.search {
  width: 100%;
  margin: 18px 0 14px;
  border: 1px solid rgba(67,230,255,.25);
  border-radius: 14px;
  background: rgba(6,29,42,.82);
  color: #fff;
  padding: 14px 16px;
  outline: none;
}

.search:focus {
  border-color: var(--cyan);
  box-shadow: 0 0 0 3px rgba(67,230,255,.09);
}

.planet-list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap: 10px;
}

.planet-button {
  appearance: none;
  border: 1px solid rgba(67,230,255,.17);
  background: linear-gradient(135deg, rgba(10,42,58,.90), rgba(4,20,31,.92));
  color: #fff;
  border-radius: 14px;
  padding: 16px;
  min-height: 76px;
  text-align: left;
  cursor: pointer;
}

.planet-button:hover {
  border-color: rgba(67,230,255,.58);
}

.planet-button strong {
  display: block;
  font-size: 1rem;
  font-weight: 600;
}

.planet-button small {
  display: block;
  color: var(--muted);
  margin-top: 5px;
}

.planet-layout {
  display: grid;
  grid-template-columns: minmax(0, .98fr) minmax(320px, 1.02fr);
  align-items: start;
  gap: 24px;
  padding-top: 18px;
}

.card-shell {
  position: sticky;
  top: 82px;
  background: rgba(3,15,23,.75);
  border: 1px solid rgba(67,230,255,.18);
  border-radius: 20px;
  padding: 10px;
  box-shadow: var(--shadow);
  touch-action: pan-y;
}

.card-image {
  display: block;
  width: 100%;
  max-width: 620px;
  height: auto;
  margin: auto;
  border-radius: 15px;
}

.effects-panel {
  border: 1px solid rgba(67,230,255,.17);
  border-radius: 20px;
  background: var(--panel);
  padding: 18px;
  box-shadow: var(--shadow);
}

.planet-heading {
  text-align: center;
  padding: 2px 4px 16px;
  border-bottom: 1px solid rgba(67,230,255,.12);
  margin-bottom: 12px;
}

.planet-heading h2 {
  margin: 0;
  font-size: clamp(1.6rem, 5vw, 2.5rem);
  font-weight: 350;
}

.planet-heading .lvl {
  margin-top: 5px;
  color: var(--cyan);
  letter-spacing: .16em;
  font-size: .82rem;
  text-transform: uppercase;
}

.effects-title {
  margin: 14px 0 10px;
  color: var(--muted);
  font-size: .72rem;
  font-weight: 700;
  letter-spacing: .20em;
  text-transform: uppercase;
}

.effect {
  display: grid;
  grid-template-columns: 66px 1fr;
  align-items: center;
  gap: 12px;
  padding: 13px 12px;
  margin: 9px 0;
  border: 1px solid rgba(67,230,255,.13);
  border-radius: 14px;
  background: rgba(10,42,58,.72);
}

.effect-icon-wrap {
  text-align: center;
}

.effect-icon {
  display: block;
  width: 54px;
  height: 54px;
  object-fit: contain;
  margin: 0 auto 2px;
  filter: drop-shadow(0 0 6px rgba(57,224,255,.18));
}

.effect-code {
  display: block;
  color: var(--cyan2);
  font-size: .68rem;
  font-weight: 700;
  letter-spacing: .06em;
}

.effect-text {
  color: #effbff;
  line-height: 1.48;
  font-size: .98rem;
}

.optional-icon {
  display: inline-block;
  width: 27px;
  height: 27px;
  object-fit: contain;
  vertical-align: -8px;
  margin-left: 6px;
  filter: drop-shadow(0 0 5px rgba(73,255,163,.25));
}

.no-effects {
  color: var(--muted);
  padding: 18px 0;
}

.nav {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 12px;
  margin-top: 18px;
}

.nav button {
  appearance: none;
  border: 1px solid rgba(67,230,255,.28);
  background: rgba(10,44,60,.88);
  color: #fff;
  border-radius: 12px;
  padding: 12px 14px;
  cursor: pointer;
}

.nav button:last-child { justify-self: end; }

.counter {
  color: var(--muted);
  font-size: .86rem;
}

.swipe-hint {
  text-align: center;
  color: #668d98;
  font-size: .76rem;
  margin-top: 10px;
}

@media (max-width: 900px) {
  .level-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .level-card:last-child { grid-column: 1 / -1; }
  .planet-layout { grid-template-columns: 1fr; }
  .card-shell { position: static; }
  .card-image { max-width: 620px; }
}

@media (max-width: 560px) {
  .hero { min-height: 58vh; }
  .home-content, .screen { padding-left: 12px; padding-right: 12px; }
  .planet-list { grid-template-columns: 1fr; }
  .level-card { min-height: 132px; }
  .effect {
    grid-template-columns: 56px 1fr;
    padding: 11px 10px;
  }
  .effect-icon { width: 46px; height: 46px; }
  .effects-panel { padding: 12px; }
  .nav button { padding: 11px 12px; font-size: .9rem; }
}
</style>
</head>

<div class="app">

  <section id="homeScreen">
    <div class="hero">
      <div class="hero-title">
                <h1>Consulta de Exoplanetas</h1>
      </div>
    </div>

    <div class="home-content">
      <p class="intro">
        Selecione o nível do Sistema Estelar para consultar as cartas e seus efeitos.
      </p>
      <div id="levelGrid" class="level-grid"></div>
    </div>
  </section>

  <section id="listScreen" class="screen">
    <div class="topbar">
      <button class="back" onclick="showHome()">← Níveis</button>
      <h1 id="listTitle" class="screen-title"></h1>
    </div>

    <input id="searchInput" class="search" type="search" placeholder="Buscar planeta..." autocomplete="off">
    <div id="planetList" class="planet-list"></div>
  </section>

  <section id="planetScreen" class="screen">
    <div class="topbar">
      <button class="back" onclick="showList()">← Lista</button>
      <h1 id="planetTopTitle" class="screen-title">Planeta</h1>
    </div>

    <div class="planet-layout">
      <div id="cardShell" class="card-shell">
        <img id="cardImage" class="card-image" alt="">
      </div>

      <div class="effects-panel">
        <div class="planet-heading">
          <h2 id="planetName"></h2>
          <div id="planetLevel" class="lvl"></div>
        </div>

        <div class="effects-title">Efeitos de investigação</div>
        <div id="effects"></div>

        <div class="nav">
          <button onclick="previousPlanet()">← Anterior</button>
          <span id="counter" class="counter"></span>
          <button onclick="nextPlanet()">Próximo →</button>
        </div>

        <div class="swipe-hint">No celular, deslize a carta para a esquerda ou para a direita.</div>
      </div>
    </div>
  </section>

</div>

const ROMANOS = {1:"I",2:"II",3:"III",4:"IV",5:"V"};
let nivelAtual = 1;
let listaAtual = [];
let indiceAtual = 0;

const homeScreen = document.getElementById("homeScreen");
const listScreen = document.getElementById("listScreen");
const planetScreen = document.getElementById("planetScreen");

function escapeHtml(s) {
  return String(s)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function showOnly(el) {
  homeScreen.style.display = "none";
  listScreen.classList.remove("active");
  planetScreen.classList.remove("active");

  if (el === homeScreen) homeScreen.style.display = "block";
  else el.classList.add("active");

  window.scrollTo({top:0, behavior:"instant"});
}

function buildLevels() {
  const grid = document.getElementById("levelGrid");
  grid.innerHTML = "";

  for (let n=1; n<=5; n++) {
    const count = PLANETAS.filter(p => p.nivel === n).length;
    const b = document.createElement("button");
    b.className = "level-card";
    b.innerHTML = `
      <span class="level-roman">${ROMANOS[n]}</span>
      <span class="level-label">Nível ${ROMANOS[n]}</span>
      <span class="level-count">${count} planetas</span>
    `;
    b.onclick = () => openLevel(n);
    grid.appendChild(b);
  }
}

function openLevel(n) {
  nivelAtual = n;
  listaAtual = PLANETAS
    .filter(p => p.nivel === n)
    .sort((a,b) => a.nome.localeCompare(b.nome, "pt-BR"));

  document.getElementById("listTitle").textContent = `Nível ${ROMANOS[n]}`;
  document.getElementById("searchInput").value = "";
  renderList(listaAtual);
  showOnly(listScreen);
}

function renderList(items) {
  const list = document.getElementById("planetList");
  list.innerHTML = "";

  items.forEach(p => {
    const originalIndex = listaAtual.findIndex(x => x.nome === p.nome);
    const b = document.createElement("button");
    b.className = "planet-button";
    b.innerHTML = `
      <strong>${escapeHtml(p.nome)}</strong>
      <small>${p.efeitos.length} efeito${p.efeitos.length === 1 ? "" : "s"}</small>
    `;
    b.onclick = () => openPlanet(originalIndex);
    list.appendChild(b);
  });

  if (!items.length) {
    list.innerHTML = `<div class="no-effects">Nenhum planeta encontrado.</div>`;
  }
}

function openPlanet(index) {
  indiceAtual = index;
  renderPlanet();
  showOnly(planetScreen);
}

function renderPlanet() {
  const p = listaAtual[indiceAtual];

  document.getElementById("planetName").textContent = p.nome;
  document.getElementById("planetTopTitle").textContent = p.nome;
  document.getElementById("planetLevel").textContent = `Nível ${ROMANOS[p.nivel]}`;

  const img = document.getElementById("cardImage");
  img.src = p.imagem;
  img.alt = `Carta do planeta ${p.nome}`;

  const effects = document.getElementById("effects");
  effects.innerHTML = "";

  if (!p.efeitos.length) {
    effects.innerHTML = `<div class="no-effects">Esta carta não possui efeitos cadastrados.</div>`;
  } else {
    p.efeitos.forEach(e => {
      const div = document.createElement("div");
      div.className = "effect";

      const optional = e.opcional
        ? `<img class="optional-icon" src="icone-opcional.png" alt="Efeito opcional" title="Efeito opcional">`
        : "";

      div.innerHTML = `
        <div class="effect-icon-wrap">
          <img class="effect-icon" src="${e.icone}" alt="${escapeHtml(e.tipo)}">
          <span class="effect-code">${escapeHtml(e.tipo)}</span>
        </div>
        <div class="effect-text">${escapeHtml(e.texto).replaceAll("\n","<br>")}${optional}</div>
      `;
      effects.appendChild(div);
    });
  }

  document.getElementById("counter").textContent =
    `${indiceAtual + 1} / ${listaAtual.length}`;

  // Preload only the neighboring high-resolution cards for smooth swiping.
  for (const offset of [-1, 1]) {
    const i = (indiceAtual + offset + listaAtual.length) % listaAtual.length;
    const pre = new Image();
    pre.src = listaAtual[i].imagem;
  }
}

function nextPlanet() {
  if (!listaAtual.length) return;
  indiceAtual = (indiceAtual + 1) % listaAtual.length;
  renderPlanet();
  window.scrollTo({top:0, behavior:"smooth"});
}

function previousPlanet() {
  if (!listaAtual.length) return;
  indiceAtual = (indiceAtual - 1 + listaAtual.length) % listaAtual.length;
  renderPlanet();
  window.scrollTo({top:0, behavior:"smooth"});
}

function showHome() {
  showOnly(homeScreen);
}

function showList() {
  showOnly(listScreen);
}

document.getElementById("searchInput").addEventListener("input", (ev) => {
  const q = ev.target.value.trim().toLocaleLowerCase("pt-BR");
  const filtered = !q ? listaAtual : listaAtual.filter(p =>
    p.nome.toLocaleLowerCase("pt-BR").includes(q)
  );
  renderList(filtered);
});

// Swipe
let touchStartX = 0;
const cardShell = document.getElementById("cardShell");

cardShell.addEventListener("touchstart", (e) => {
  touchStartX = e.changedTouches[0].clientX;
}, {passive:true});

cardShell.addEventListener("touchend", (e) => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (dx < -55) nextPlanet();
  if (dx > 55) previousPlanet();
}, {passive:true});

// Desktop keyboard navigation
document.addEventListener("keydown", (e) => {
  if (!planetScreen.classList.contains("active")) return;
  if (e.key === "ArrowRight") nextPlanet();
  if (e.key === "ArrowLeft") previousPlanet();
});

buildLevels();
showHome();
</script>
