<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03121c">
<title>Life Hunt — Arquivo Planetário</title>
<style>
:root {
  --bg:#03121c;
  --panel:rgba(5,28,42,.92);
  --panel2:rgba(9,45,63,.86);
  --cyan:#2fe9ff;
  --cyan2:#73f4ff;
  --text:#f5fbff;
  --muted:#9ab8c6;
  --line:rgba(47,233,255,.35);
  --shadow:0 0 22px rgba(47,233,255,.14);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  background:
    radial-gradient(circle at 15% 10%, rgba(0,170,220,.12), transparent 30%),
    linear-gradient(180deg,#02101a,#061824 70%,#020b11);
  font-family:Arial,Helvetica,sans-serif;
}
button,input{font:inherit}
button{-webkit-tap-highlight-color:transparent}
.oculto{display:none!important}

#home{
  min-height:100vh;
  position:relative;
  background:
    linear-gradient(180deg,rgba(0,7,12,.20),rgba(0,7,12,.74) 56%,#03121c 100%),
    url('cover.jpg') center top/cover no-repeat;
}
.home-inner{
  width:min(92%,620px);
  margin:auto;
  padding:52vh 0 42px;
  text-align:center;
}
.home-title{
  margin:0 0 5px;
  letter-spacing:.35em;
  padding-left:.35em;
  font-size:clamp(30px,8vw,46px);
  text-shadow:0 0 14px rgba(47,233,255,.75);
}
.home-sub{
  margin:0 0 22px;
  color:var(--cyan2);
  text-transform:uppercase;
  letter-spacing:.17em;
  font-size:13px;
}
.level-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
}
.level-btn{
  position:relative;
  overflow:hidden;
  width:100%;
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px 18px;
  color:#fff;
  background:linear-gradient(135deg,rgba(7,43,62,.88),rgba(8,26,39,.94));
  box-shadow:var(--shadow);
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.level-btn::before{
  content:"";
  position:absolute;
  left:0; top:0; bottom:0;
  width:4px;
  background:var(--cyan);
  box-shadow:0 0 12px var(--cyan);
}
.level-name{font-size:20px;font-weight:700;letter-spacing:.08em}
.level-count{font-size:12px;color:var(--muted)}
.home-note{margin:18px 8px 0;color:#a7bfca;font-size:12px;line-height:1.45}

.app{
  width:min(94%,720px);
  margin:auto;
  padding:16px 0 42px;
}
.topbar{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 0;
  background:linear-gradient(180deg,rgba(3,18,28,.98),rgba(3,18,28,.88),transparent);
  backdrop-filter:blur(6px);
}
.back{
  border:1px solid var(--line);
  background:#092637;
  color:var(--cyan2);
  border-radius:10px;
  padding:10px 12px;
  cursor:pointer;
}
.top-title{margin:0;font-size:20px;letter-spacing:.06em}
.search{
  width:100%;
  margin:8px 0 12px;
  background:#071d2a;
  color:white;
  border:1px solid rgba(47,233,255,.24);
  border-radius:12px;
  padding:13px 14px;
  outline:none;
}
.search:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(47,233,255,.09)}
.planet-list{display:grid;gap:9px}
.planet-row{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  border:1px solid rgba(47,233,255,.22);
  background:linear-gradient(135deg,#082433,#071b27);
  color:white;
  border-radius:13px;
  padding:8px;
  cursor:pointer;
  text-align:left;
}
.planet-row img{
  width:58px;
  height:70px;
  object-fit:contain;
  border-radius:7px;
  flex:0 0 auto;
}
.planet-row strong{display:block;font-size:17px}
.planet-row span{display:block;margin-top:4px;color:var(--muted);font-size:12px}
.empty{color:var(--muted);text-align:center;padding:28px 8px}

.viewer{padding-bottom:30px}
.card-wrap{
  display:flex;
  justify-content:center;
  margin:4px 0 16px;
}
.planet-card{
  width:min(82vw,390px);
  height:auto;
  display:block;
  filter:drop-shadow(0 0 20px rgba(42,213,255,.19));
  user-select:none;
  -webkit-user-drag:none;
}
.detail-name{
  text-align:center;
  margin:2px 0 2px;
  font-size:26px;
  letter-spacing:.04em;
}
.detail-level{
  text-align:center;
  margin:0 0 17px;
  color:var(--cyan2);
  font-size:13px;
  letter-spacing:.15em;
  text-transform:uppercase;
}
.effects-title{
  margin:0 0 8px;
  color:#cceef5;
  font-size:13px;
  text-transform:uppercase;
  letter-spacing:.14em;
}
.effects{display:grid;gap:10px}
.effect{
  border:1px solid rgba(47,233,255,.20);
  background:linear-gradient(135deg,rgba(8,42,59,.96),rgba(6,27,39,.96));
  border-radius:12px;
  padding:13px 14px;
  line-height:1.45;
  box-shadow:0 5px 18px rgba(0,0,0,.17);
}
.effect-head{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:54px;
  margin-right:8px;
  padding:4px 8px;
  border:1px solid rgba(47,233,255,.38);
  border-radius:999px;
  color:var(--cyan2);
  font-weight:700;
  letter-spacing:.05em;
  font-size:13px;
}
.optional{
  color:#ffe9a7;
  font-weight:700;
}
.nav{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:10px;
  margin:16px 0 5px;
}
.nav button{
  border:1px solid var(--line);
  background:#0a3246;
  color:white;
  border-radius:11px;
  padding:12px;
  cursor:pointer;
}
.nav button:last-child{justify-self:stretch}
.counter{color:var(--muted);font-size:13px;min-width:62px;text-align:center}
.swipe-tip{text-align:center;color:#7897a5;font-size:12px;margin-top:8px}
@media (min-width:600px){
  .level-grid{grid-template-columns:1fr 1fr}
  .level-btn:last-child{grid-column:1/-1}
  .planet-list{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<section id="home">
  <div class="home-inner">
    <h1 class="home-title">LIFE HUNT</h1>
    <p class="home-sub">Arquivo Planetário</p>
    <div id="levelGrid" class="level-grid"></div>
    <p class="home-note">Selecione o nível do sistema estelar para consultar os planetas e seus efeitos.</p>
  </div>
</section>

<main id="listScreen" class="app oculto">
  <div class="topbar">
    <button class="back" onclick="showHome()">←</button>
    <h2 id="listTitle" class="top-title">Nível I</h2>
  </div>
  <input id="search" class="search" type="search" placeholder="Buscar planeta..." oninput="renderList()">
  <div id="planetList" class="planet-list"></div>
</main>

<main id="detailScreen" class="app viewer oculto">
  <div class="topbar">
    <button class="back" onclick="backToList()">← Lista</button>
    <h2 class="top-title">Arquivo Planetário</h2>
  </div>

  <div id="swipeArea">
    <div class="card-wrap">
      <img id="cardImage" class="planet-card" alt="">
    </div>
    <h1 id="planetName" class="detail-name"></h1>
    <p id="planetLevel" class="detail-level"></p>
    <p class="effects-title">Efeitos da investigação</p>
    <div id="effects" class="effects"></div>
  </div>

  <div class="nav">
    <button onclick="previousPlanet()">← Anterior</button>
    <span id="counter" class="counter"></span>
    <button onclick="nextPlanet()">Próximo →</button>
  </div>
  <div class="swipe-tip">No celular, deslize para a esquerda ou direita.</div>
</main>

const roman = {1:"I",2:"II",3:"III",4:"IV",5:"V"};
let currentLevel = 1;
let currentPlanets = [];
let currentIndex = 0;

function countLevel(level){
  return planetas.filter(p => p.nivel === level).length;
}

function renderHome(){
  const grid = document.getElementById("levelGrid");
  grid.innerHTML = "";
  for(let level=1; level<=5; level++){
    const b = document.createElement("button");
    b.className = "level-btn";
    b.onclick = () => openLevel(level);
    b.innerHTML = `<span class="level-name">NÍVEL ${roman[level]}</span>
                   <span class="level-count">${countLevel(level)} planetas</span>`;
    grid.appendChild(b);
  }
}

function showOnly(id){
  ["home","listScreen","detailScreen"].forEach(x =>
    document.getElementById(x).classList.toggle("oculto", x !== id)
  );
  window.scrollTo(0,0);
}

function showHome(){
  document.getElementById("search").value = "";
  showOnly("home");
}

function openLevel(level){
  currentLevel = level;
  currentPlanets = planetas
    .filter(p => p.nivel === level)
    .sort((a,b) => a.nome.localeCompare(b.nome,"pt-BR"));
  document.getElementById("listTitle").textContent = `Nível ${roman[level]}`;
  document.getElementById("search").value = "";
  renderList();
  showOnly("listScreen");
}

function renderList(){
  const q = document.getElementById("search").value.trim().toLocaleLowerCase("pt-BR");
  const area = document.getElementById("planetList");
  const filtered = currentPlanets.filter(p => p.nome.toLocaleLowerCase("pt-BR").includes(q));
  area.innerHTML = "";
  if(!filtered.length){
    area.innerHTML = `<div class="empty">Nenhum planeta encontrado.</div>`;
    return;
  }
  filtered.forEach(p => {
    const originalIndex = currentPlanets.findIndex(x => x.nome === p.nome);
    const b = document.createElement("button");
    b.className = "planet-row";
    b.onclick = () => openPlanet(originalIndex);
    b.innerHTML = `<img loading="lazy" src="${p.imagem}" alt="">
                   <div><strong>${escapeHtml(p.nome)}</strong>
                   <span>Nível ${roman[p.nivel]} · ${p.efeitos.length} efeitos</span></div>`;
    area.appendChild(b);
  });
}

function openPlanet(index){
  currentIndex = index;
  renderPlanet();
  showOnly("detailScreen");
}

function renderPlanet(){
  const p = currentPlanets[currentIndex];
  const img = document.getElementById("cardImage");
  img.src = p.imagem;
  img.alt = `Carta do planeta ${p.nome}`;
  document.getElementById("planetName").textContent = p.nome;
  document.getElementById("planetLevel").textContent = `Nível ${roman[p.nivel]}`;
  document.getElementById("counter").textContent = `${currentIndex+1} / ${currentPlanets.length}`;

  const effects = document.getElementById("effects");
  effects.innerHTML = "";
  p.efeitos.forEach(e => {
    const div = document.createElement("div");
    div.className = "effect";
    let txt = escapeHtml(e.text).replace(/\n/g,"<br>");
    txt = txt.replace(/\(Opcional\)/gi,'<span class="optional">(Opcional)</span>');
    div.innerHTML = `<span class="effect-head">${escapeHtml(e.attr)}</span>${txt}`;
    effects.appendChild(div);
  });
}

function previousPlanet(){
  currentIndex = (currentIndex - 1 + currentPlanets.length) % currentPlanets.length;
  renderPlanet();
  window.scrollTo(0,0);
}

function nextPlanet(){
  currentIndex = (currentIndex + 1) % currentPlanets.length;
  renderPlanet();
  window.scrollTo(0,0);
}

function backToList(){
  renderList();
  showOnly("listScreen");
}

function escapeHtml(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

let touchStartX = 0;
let touchStartY = 0;
const swipeArea = document.getElementById("swipeArea");
swipeArea.addEventListener("touchstart", e => {
  const t = e.changedTouches[0];
  touchStartX = t.screenX;
  touchStartY = t.screenY;
}, {passive:true});
swipeArea.addEventListener("touchend", e => {
  const t = e.changedTouches[0];
  const dx = t.screenX - touchStartX;
  const dy = t.screenY - touchStartY;
  if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)){
    dx < 0 ? nextPlanet() : previousPlanet();
  }
}, {passive:true});

renderHome();
</script>
